name: Release
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Existing full commit SHA to redeploy/roll back; leave blank to build current main'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' && vars.ENABLE_AWS_DEPLOYMENT == 'true' && vars.IMAGE_REPOSITORY != '' &&
      vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_REGION != '' &&
      (github.event_name == 'push' || inputs.release_sha == '')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: go vet ./... && go test -race ./...
      - uses: docker/setup-buildx-action@v3
      - name: Inspect deployment identity claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            core.setSecret(token);
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.info(JSON.stringify({iss: claims.iss, aud: claims.aud, sub: claims.sub, repository: claims.repository, ref: claims.ref, environment: claims.environment}));
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-platform-build
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Resolve immutable release image
        id: image
        env:
          IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
        run: |
          repository=${IMAGE_REPOSITORY#*/}
          if aws ecr describe-images --repository-name "$repository" --image-ids imageTag="$GITHUB_SHA" > image.json 2> image-error.txt; then
            docker pull "$IMAGE_REPOSITORY:$GITHUB_SHA"
            docker tag "$IMAGE_REPOSITORY:$GITHUB_SHA" platform:release
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q ImageNotFoundException image-error.txt; then
            docker build --build-arg VERSION="$GITHUB_SHA" -t platform:release .
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat image-error.txt >&2
            exit 1
          fi
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: platform:release
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Publish the scanned image
        if: steps.image.outputs.exists != 'true'
        env:
          IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
        run: |
          docker tag platform:release "$IMAGE_REPOSITORY:$GITHUB_SHA"
          docker push "$IMAGE_REPOSITORY:$GITHUB_SHA"
      - name: Package deployment files
        id: release
        run: |
          mkdir -p dist
          tar -czf dist/release.tar.gz -C deploy compose.aws.yaml Caddyfile -C ../scripts deploy.sh
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-bundle
          path: dist/release.tar.gz
          retention-days: 7
  deploy:
    needs: build
    if: >-
      always() && github.ref == 'refs/heads/main' && vars.ENABLE_AWS_DEPLOYMENT == 'true' &&
      vars.AWS_DEPLOY_ROLE_ARN != '' && vars.INSTANCE_ID != '' &&
      vars.RELEASE_BUCKET != '' && vars.AWS_REGION != '' &&
      vars.SSM_LOG_GROUP != '' && vars.APP_URL != '' &&
      (needs.build.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_sha != ''))
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Select release
        env:
          BUILT_SHA: ${{ needs.build.outputs.release_sha }}
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: |
          RELEASE_SHA="${BUILT_SHA:-$REQUESTED_SHA}"
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-platform-release
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        with:
          name: deployment-bundle
          path: dist
      - name: Store versioned deployment bundle
        if: needs.build.result == 'success'
        env:
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
        run: |
          cd dist
          sha256sum release.tar.gz > release.tar.gz.sha256
          aws s3 cp release.tar.gz "s3://$RELEASE_BUCKET/releases/$RELEASE_SHA/release.tar.gz"
          aws s3 cp release.tar.gz.sha256 "s3://$RELEASE_BUCKET/releases/$RELEASE_SHA/release.tar.gz.sha256"
      - name: Deploy through Systems Manager
        env:
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
          SSM_LOG_GROUP: ${{ vars.SSM_LOG_GROUP }}
        run: bash scripts/ssm-deploy.sh
      - name: Verify public HTTPS release with Go
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: go run ./cmd/smoke -url "$APP_URL" -expect-version "$RELEASE_SHA" -timeout 60s
