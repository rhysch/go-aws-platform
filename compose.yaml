services:
  api:
    build:
      context: .
      args:
        VERSION: local
    image: go-aws-platform:local
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 128m
    stop_grace_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - "127.0.0.1:${PROXY_PORT:-8088}:80"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 128m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
